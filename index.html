let language='en',tab='home',appointments=JSON.parse(localStorage.getItem('mhc_demo_appointments')||'[]'),notes=JSON.parse(localStorage.getItem('mhc_demo_notes')||'{}');const t=k=>T[language][k]||T.en[k],escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem('mhc_demo_appointments',JSON.stringify(appointments));localStorage.setItem('mhc_demo_notes',JSON.stringify(notes))}function stat(label,value){return `<div class="stat"><strong>${value}</strong>${t(label)}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function panel(content){return `<section class="panel">${content}</section>`}function render(){document.documentElement.lang=language;document.body.dir=language==='dv'?'rtl':'ltr';document.getElementById('subtitle').textContent=t('subtitle');document.getElementById('lang').value=language;document.getElementById('tabs').innerHTML=['home','booking','doctor','patients','admin'].map(k=>`<button data-tab="${k}" class="${tab===k?'active':''}">${t(k)}</button>`).join('');let html='';if(tab==='home')html=panel(`<h2 class="section-title">${t('welcome')}</h2><p>${t('intro')}</p><div class="grid">${stat('total',appointments.length)}${stat('patientsCount',patients.length)}${stat('staffCount',staff.length)}${stat('open',appointments.filter(a=>a.status==='pending').length)}</div>`)+panel(`<h2>${t('services')}</h2><div class="grid">${['service1','service2','service3'].map(k=>`<div class="stat">✚ ${t(k)}</div>`).join('')}</div><p class="warning">${t('notice')}</p>`);if(tab==='booking')html=panel(`<h2>${t('newbook')}</h2><p class="muted">${t('sample')}</p><form id="bookingform"><label class="field">${t('patientname')}<input id="name" maxlength="60" placeholder="e.g. Demo Patient" required></label><label class="field">${t('department')}<select id="department"><option>General OPD</option><option>Follow-up Consultation</option><option>Nursing Services</option></select></label><label class="field">${t('date')}<input id="date" type="date" value="2026-10-19" required></label><label class="field">${t('reason')}<textarea id="reason" rows="3" maxlength="300" placeholder="Optional"></textarea></label><button class="btn primary" type="submit">${t('request')}</button></form><p class="muted">${t('notReal')}</p>`)+panel(`<h2>${t('requests')}</h2>${appointmentTable(false)}`);if(tab==='doctor')html=panel(`<h2>${t('doctorTitle')}</h2><p class="warning">${t('notice')}</p><label class="field">${t('choose')}<select id="selectedpatient">${patients.map((p,i)=>`<option value="${i}">${p.id} — ${p.name}</option>`).join('')}</select></label><div id="doctorrecord"></div>`);if(tab==='patients')html=panel(`<h2>${t('patientTitle')}</h2><p class="warning">${t('notice')}</p>${patients.map(p=>`<div class="record"><h3>${p.name} <span class="tag">${p.id}</span></h3><p>${t('age')}: ${p.age} • ${t('visit')}: ${p.visit}</p><p><b>${t('diagnosis')}:</b> ${p.diagnosis}</p><p><b>${t('treatment')}:</b> ${p.treatment}</p><p><b>${t('followup')}:</b> ${p.followup}</p></div>`).join('')}`);if(tab==='admin')html=panel(`<h2>${t('adminTitle')}</h2><div class="grid">${stat('total',appointments.length)}${stat('open',appointments.filter(a=>a.status==='pending').length)}${stat('patientsCount',patients.length)}${stat('staffCount',staff.length)}</div>`)+panel(`<h2>${t('requests')}</h2>${appointmentTable(true)}`)+panel(`<h2>${t('staff')}</h2>${table([t('doctorname'),t('room'),'Illustrative hours'],staff.map(r=>r.map(escapeHTML)))}`)+panel(`<h2>${t('documents')}</h2><p class="muted">Metadata examples only. No real official documents are included.</p>${table([t('document'),t('owner'),t('access')],docs.map(r=>r.map(escapeHTML)))}`);document.getElementById('view').innerHTML=html;if(tab==='doctor'){document.getElementById('selectedpatient').addEventListener('change',renderDoctor);renderDoctor()}if(tab==='booking')document.getElementById('bookingform').addEventListener('submit',submitBooking)}function appointmentTable(admin){if(!appointments.length)return `<p class="muted">${t('empty')}</p>`;return table([t('patientname'),t('department'),t('date'),t('status'),...(admin?[t('actions')]:[])],appointments.map((a,i)=>[escapeHTML(a.name),escapeHTML(a.department),escapeHTML(a.date),`<span class="tag">${t(a.status)}</span>`,...(admin?[a.status==='pending'?`<button class="btn" data-action="approve" data-index="${i}">${t('approve')}</button><button class="btn" data-action="decline" data-index="${i}">${t('decline')}</button>`:'—']:[])]))}function submitBooking(e){e.preventDefault();const name=document.getElementById('name').value.trim(),date=document.getElementById('date').value;if(!name||!date){alert(t('error'));return}appointments.unshift({name,department:document.getElementById('department').value,date,reason:document.getElementById('reason').value.trim(),status:'pending'});persist();render();alert(t('confirm')+' '+t('notReal'))}function renderDoctor(){let p=patients[Number(document.getElementById('selectedpatient').value)],n=notes[p.id]||'';document.getElementById('doctorrecord').innerHTML=`<div class="record"><h3>${p.name} • ${p.id}</h3><p><b>${t('diagnosis')}:</b> ${p.diagnosis}</p><p><b>${t('treatment')}:</b> ${p.treatment}</p><p><b>${t('followup')}:</b> ${p.followup}</p><label class="field">${t('notes')}<textarea id="clinicalnote" rows="4" maxlength="1000">${escapeHTML(n)}</textarea></label><button class="btn primary" id="savenote">${t('save')}</button></div>`;document.getElementById('savenote').onclick=()=>{notes[p.id]=document.getElementById('clinicalnote').value;persist();alert(t('saveok'))}}document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});document.getElementById('view').addEventL
