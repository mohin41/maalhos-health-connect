<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b80"><title>Maalhos Health Connect | Demo v2</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans Thaana','Noto Sans Bengali',sans-serif;color:#163344;background:#eef6f7}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:16px 14px 80px}.hero{background:linear-gradient(120deg,#075c6c,#079d94);color:white;border-radius:24px;padding:23px;box-shadow:0 10px 25px #074f5920}.eyebrow{display:inline-block;background:#ffebaa;color:#574214;padding:7px 11px;border-radius:30px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(28px,6vw,43px);margin:20px 0 6px;line-height:1.12}.hero p{margin:7px 0 17px;opacity:.9}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}select,input,textarea{width:100%;border:1px solid #d4e2e4;border-radius:12px;background:white;padding:12px;color:#183d48;font:inherit}select.language{width:auto;min-width:150px}.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0;scrollbar-width:thin}.tabs button{white-space:nowrap;background:white;color:#175a66;border:1px solid #dce9ea;border-radius:13px;padding:13px 15px;font-weight:700}.tabs button.active{background:#087783;color:white}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid #dce9eb;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 5px 16px #124d5a0a}.card h2{margin:0 0 14px;font-size:21px}.card h3{margin:0 0 9px}.muted{color:#637c84}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{background:#edf7f5;border-radius:15px;padding:18px}.stat strong{display:block;font-size:29px;color:#087783}.btn{border:0;border-radius:12px;padding:12px 17px;background:#087783;color:white;font-weight:700;cursor:pointer;font:inherit}.btn.alt{background:#e8f4f4;color:#126574}.btn.danger{background:#fff0ed;color:#a43f36}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-weight:700;font-size:14px;margin:13px 0 6px}.row{display:flex;justify-content:spac </style></head><body><main class="shell"><header class="hero"><div class="top"><span class="eyebrow">DEMO • NOT AN OFFICIAL HEALTH CENTRE APP</span><select id="lang" class="language" aria-label="Language"><option value="en">English</option><option value="dv">ދިވެހި (Dhivehi)</option><option value="bn">বাংলা (Bangla)</option></select></div><h1>✚ Maalhos Health Connect</h1><p id="subtitle">Baa. Maalhos • Healthcare Management Prototype</p><div class="actions"><button class="btn alt" onclick="resetDemo()" id="reset">↻ Reset demo</button><span class="small" style="align-self:center">Version 2.0 · Offline browser demo</span></div></header><nav class="tabs" id="tabs"></nav><section id="home" class="panel active"></section><section id="booking" class="panel"></section><section id="patient" class="panel"></section><section id="doctor" class="panel"></section><section id="admin" class="panel"></section><div class="footer">Illustrative records only · No backend · No actual appointments or clinical services</div></main><script>
const dict={en:{tabs:['Home','Book Appointment','Patient Portal','Doctor Dashboard','Admin Dashboard'],welcome:'Welcome to Maalhos Health Connect',intro:'A mobile-friendly concept for appointments, community healthcare and staff coordination.',book:'Book a demo appointment',services:'Services (illustrative)',serviceNames:['General OPD','Follow-up consultation','Nursing services','Health education'],how:'How this prototype works',howText:'All patient records, staff, schedules and appointments are fictional. Booking changes are saved only in this browser.',appointment:'Doctor appointment request',name:'Patient name (fictional only)',department:'Department',doctor:'Preferred doctor',date:'Preferred date',time:'Preferred time',reason:'Reason (optional)',submit:'Create demo request',yourBookings:'Demo booking requests on this device',patients:'Sample patient records',diagnosis:'Diagnosis',treatment:'Treatment',followup:'Follow-up',doctorTitle:'Doctor workspace (demonstration)',clinical:'Clinical note editor (fictional records)',note:'Clinical note',save:'Save demo note',adminTitle:'Management dashboard',roster:'Illustrative duty roster',documents:'Sample official document register',status:'Status',approve:'Approve',decline:'Decline',pending:'Pending',approved:'Approved',declined:'Declined',noBookings:'No demo appointments yet.',reset:'↻ Reset demo',confirm:'Demo appointment created. No real booking was made.',noteSaved:'Sample note saved in this browser.',notReal:'This is a public demonstration. Do not enter real patient names, health details or confidential documents.',appointments:'Appointments',staff:'Staff roles',records:'Sample patients',selectPatient:'Select fictional patient',hours:'Illustrative hours',sample:'SAMPLE · FICTIONAL'},bn:{tabs:['হোম','ডাক্তার বুকিং','রোগী পোর্টাল','ডাক্তার ড্যাশবোর্ড','অ্যাডমিন ড্যাশবোর্ড'],welcome:'Maalhos Health Connect-এ স্বাগতম',intro:'অ্যাপয়েন্টমেন্ট, কমিউনিটি স্বাস্থ্যসেবা ও কর্মী ব্যবস্থাপনার মোবাইল ডেমো।',book:'ডেমো অ্যাপয়েন্ট ފޮލޯ-އަޕް',doctorTitle:'ޑޮކްޓަރ ޑޭޝްބޯޑް',clinical:'ނަމޫނާ ނޯޓް',note:'ނޯޓް',save:'ސޭވް',adminTitle:'އެޑްމިން ޑޭޝްބޯޑް',roster:'ޑިއުޓީ ރޯސްޓަރ',documents:'ނަމޫނާ ޑޮކިއުމަންޓްތައް',status:'ހާލަތު',approve:'އެޕްރޫވް',decline:'ރިޖެކްޓް',pending:'ޕެންޑިންގ',approved:'އެޕްރޫވްޑް',declined:'ރިޖެކްޓް',noBookings:'ވަގުތެއް ނެތް',reset:'↻ ރީސެޓް',confirm:'ނަމޫނާ ރިކުއެސްޓް ހެދިއްޖެ.',noteSaved:'ނޯޓް ސޭވް ކުރެވިއްޖެ.',notReal:'މިއީ ނަމޫނާ އެޕެއް. ޙަޤީޤީ މަރީޟުންގެ މަޢުލޫމާތު ނުލާށެވެ.',appointments:'ވަގުތުތައް',staff:'މުވައްޒަފުން',records:'ނަމޫނާ މަރީޟުން',selectPatient:'މަރީޟެއް ހޮވާ',hours:'ނަމޫނާ ގަޑި',sample:'ނަމޫނާ'}};
const samplePatients=[{id:'P-001',name:'Amina Example',age:34,diagnosis:'Uncomplicated upper respiratory tract infection (illustrative)',treatment:'Supportive care and safety-net advice (illustrative)',followup:'Return if symptoms worsen'},{id:'P-002',name:'Hassan Sample',age:51,diagnosis:'Blood pressure review (illustrative)',treatment:'Lifestyle counselling; clinician review (illustrative)',followup:'Review in 2 weeks'},{id:'P-003',name:'Sara Demo',age:24,diagnosis:'Routine health assessment (illustrative)',treatment:'Health education (illustrative)',followup:'As required'}];
const initial=[{id:1,name:'Demo Visitor A',department:'General OPD',doctor:'Available clinician',date:'2026-10-19',time:'09:00',reason:'Sample consultation',status:'pending'},{id:2,name:'Demo Visitor B',department:'Follow-up',doctor:'Available clinician',date:'2026-10-19',time:'10:30',reason:'Sample follow-up',status:'approved'}];
let bookings=read('mhc_v2_bookings',initial),notes=read('mhc_v2_notes',{}),lang='en',active='home';function read(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch{return f}}function save(){localStorage.setItem('mhc_v2_bookings',JSON.stringify(bookings));localStorage.setItem('mhc_v2_notes',JSON.stringify(notes))}function t(k){return dict[lang][k]}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(){return `<div class="notice">⚠ ${t('notReal')}</div>`}function card(title,content){return `<div class="card"><h2>${title}</h2>${content}</div>`}function setTab(k){active=k;render();window.scrollTo({top:180,behavior:'smooth'})}function statusPill(s){return `<span class="pill ${s}">${t(s)}</span>`}function appointmentCards(admin=false){return bookings.length?bookings.map(b=>`<div class="item"><div class="row"><div><strong>${esc(b.name)}</strong> <span class="muted small">#${b.id}</span><p class="small">${esc(b.department)} · ${esc(b.doctor)}</p><p class="small">📅 ${esc(b.date)} · ${esc(b.time)}</p>${b.reason?`<p class="small muted">${esc(b.reason)}</p>`:''}</div>${statusPill(b.status)}</div>${admin?`<div class="actions"><button class="btn" onclick="changeStatus(${b.id},'approved')">${t('approve')}</button><button class="btn danger" onclick="changeStatus(${b.id},'declined')">${t('decline')}</button></div>`:''}</div>`).join(''):`<div class="empty">${t('noBookings')}</div>`}function render(){document.documentElement.lang=lang;document.getElementById('lang').value=lang;document.getElementById('subtitle').textContent=lang==='bn'?'বা. মাআলহোস • স্বাস্থ্যসেবা ব্যবস্থাপনা ডেমো':lang==='dv'?'ބ. މާޅޮސް • ނަމޫނާ އެޕް':'Baa. Maalhos • Healthcare Management Prototype';document.getElementById('reset').textContent=t('reset');document.getElementById('tabs').innerHTML=['home','booking','patient','doctor','admin'].map((k,i)=>`<button class="${active===k?'active':''}" onclick="setTab('${k}')">${t('tabs')[i]}</button>`).join('');document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id===active));
document.getElementById('home').innerHTML=card(t('welcome'),`<p class="muted">${t('intro')}</p><div class="grid"><div class="stat"><strong>${bookings.length}</strong>${t('appointments')}</div><div class="stat"><strong>3</strong>${t('records')}</div><div class="stat"><strong>3</strong>${t('staff')}</div></div><div class="actions"><button class="btn" onclick="setTab('booking')">${t('book')} →</button></div>`)+card(t('services'),`<div class="grid">${t('serviceNames').map((x,i)=>`<div class="item">${['🩺','📋','💉','💚'][i]} ${x}</div>`).join('')}</div>`)+card(t('how'),`<p class="muted">${t('howText')}</p>`)+notice();
document.getElementById('booking').innerHTML=card(t('appointment'),`<form id="bookingForm"><label>${t('name')}</label><input name="name" required maxlength="60" placeholder="Example: Demo Patient C"><label>${t('department')}</label><select name="department"><option>General OPD</option><option>Follow-up</option><option>Nursing services</option></select><label>${t('doctor')}</label><select name="doctor"><option>Available clinician (demo)</option><option>Doctor A (fictional)</option><option>Doctor B (fictional)</option></select><div class="grid"><div><label>${t('date')}</label><input name="date" type="date" required min="2026-10-17" value="2026-10-19"></div><div><label>${t('time')}</label><select name="time"><option>09:00</option><option>10:00</option><option>10:30</option><option>11:00</option><option>14:00</option></select></div></div><label>${t('reason')}</label><textarea name="reason" maxlength="150" rows="2" placeholder="Demo text only"></textarea><div class="actions"><button class="btn" type="submit">${t('submit')}</button></div></form>`)+card(t('yourBookings'),appointmentCards())+notice();document.getElementById('bookingForm').addEventListener('submit',addBooking);
document.getElementById('patient').innerHTML=card(t('patients'),samplePatients.map(p=>`<div class="item"><div class="row"><strong>${p.name}</strong><span class="pill">${p.id}</span></div><p class="small muted">Age ${p.age} · ${t('sample')}</p><p><strong>${t('diagnosis')}:</strong> ${p.diagnosis}</p><p><strong>${t('treatment')}:</strong> ${p.treatment}</p><p><strong>${t('followup')}:</strong> ${p.followup}</p></div>`).join(''))+notice();
document.getElementById('doctor').innerHTML=card(t('doctorTitle'),`<p class="muted">${t('clinical')}</p><label>${t('selectPatient')}</label><select id="patientSelect" onchange="showNote()">${samplePatients.map(p=>`<option value="${p.id}">${p.name} (${p.id})</option>`).join('')}</select><div id="clinicalDetail"></div><label>${t('note')}</label><textarea id="clinicalNote" rows="4" maxlength="1000" placeholder="Fictional notes only"></textarea><div class="actions"><button class="btn" onclick="saveNote()">${t('save')}</button></div>`)+notice();showNote();
document.getElementById('admin').innerHTML=card(t('adminTitle'),`<div class="grid"><div class="stat"><strong>${bookings.length}</strong>${t('appointments')}</div><div class="stat"><strong>${bookings.filter(b=>b.status==='pending').length}</strong>${t('pending')}</div><div class="stat"><strong>3</strong>${t('staff')}</div></div>`)+card(t('appointments'),appointmentCards(true))+card(t('roster'),`<div class="grid">${[['General OPD Clinician','09:00–15:00'],['Nursing Team','08:00–16:00'],['Reception / Records','08:00–16:00']].map(a=>`<div class="item"><strong>${a[0]}</strong><p class="small muted">${t('hours')}: ${a[1]}</p><span class="pill">${t('sample')}</span></div>`).join('')}</div>`)+card(t('documents'),`<div class="item">📄 Sample duty roster template <span class="pill">${t('sample')}</span></div><div class="item">📄 Sample incident report template <span class="pill">${t('sample')}</span></div><div class="item">📄 Sample stock register template <span class="pill">${t('sample')}</span></div>`)+notice()}
function addBooking(e){e.preventDefault();let f=new FormData(e.target);let b={id:Date.now(),name:String(f.get('name')).trim(),department:f.get('department'),doctor:f.get('doctor'),date:f.get('date'),time:f.get('time'),reason:String(f.get('reason')).trim(),status:'pending'};if(!b.name)return;bookings.unshift(b);save();render();alert(t('confirm'))}function changeStatus(id,status){bookings=bookings.map(b=>b.id===id?{...b,status}:b);save();render()}function showNote(){let el=document.getElementById('patientSelect');if(!el)return;let p=samplePatients.find(x=>x.id===el.value);document.getElementById('clinicalDetail').innerHTML=`<div class="item"><p><strong>${t('diagnosis')}:</strong> ${p.diagnosis}</p><p><strong>${t('treatment')}:</strong> ${p.treatment}</p><p><strong>${t('followup')}:</strong> ${p.followup}</p></div>`;document.getElementById('clinicalNote').value=notes[p.id]||''}function saveNote(){notes[document.getElementById('patientSelect').value]=document.getElementById('clinicalNote').value;save();alert(t('noteSaved'))}function resetDemo(){if(confirm('Reset all fictional demo changes on this device?')){bookings=structuredClone(initial);notes={};save();render()}}document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;render()});render();
</script></body></html>
